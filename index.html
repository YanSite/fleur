  // Сцена готова: статичная обложка первого кадра гаснет.
  showScene() { if (this.state.ready) return; this.setState({ ready: true }); const c = document.getElementById('cover'); if (c) c.classList.add('done'); }
  isPort() { return this.portrait(window.innerWidth, window.innerHeight); }
  seq() { const a = []; for (let i = 0; i < this.SHOTS.length; i++) a.push(i); return a; }
  nb(i, d) { const q = this.seq(); let k = q.indexOf(i); if (k < 0) { k = 0; while (k < q.length && q[k] < i) k++; k--; } const n = k + d; return n >= 0 && n < q.length ? q[n] : -1; }
  request(d) {
    const c = this.state.cur, last = this.SHOTS.length - 1;
    if (this.tw || performance.now() < this.lockUntil) {
      const tgt = this.tw ? this.tw.target : c;
      if (this.nb(tgt, d) >= 0) this.queue = d;
      return;
    }
    const n = this.nb(c, d);
    if (n < 0) { this.dragT = 0; return; }
    this.go(n);
  }
  step(d) { this.request(d); }
  go(i) {
    const n = Math.max(0, Math.min(this.SHOTS.length - 1, i));
    if (n === this.state.cur && !this.tw) return;
    const from = this.y, to = this.rest(n), dist = Math.abs(n - this.state.cur);
    const port = this.isPort();
    const dur = this.reduce ? 500 : (port ? Math.min(2600, 1500 + (dist - 1) * 180) : Math.min(3400, 2000 + (dist - 1) * 220));
    this.dragT = 0; this.dragOff = 0;
    this.tw = { from: from, to: to, start: performance.now(), dur: dur, target: n, shown: false, showAt: port ? 0.42 : 0.62 };
    this.setState({ ch: -1, cur: n, step: 0 });
    window.dispatchEvent(new CustomEvent('concept:final', { detail: n === this.SHOTS.length - 1 }));
  }
  frame() {
    if (!this.eng) return;
    const now = performance.now(), dt = Math.min(0.1, (now - (this.lastNow || now)) / 1000);
    this.lastNow = now;
    this.dragOff += (this.dragT - this.dragOff) * (1 - Math.exp(-dt * 14));
    if (this.tw) {
      const t = this.tw, k = Math.min(1, (now - t.start) / t.dur);
      const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      this.y = t.from + (t.to - t.from) * e;
      if (!t.shown && k > t.showAt) { t.shown = true; this.arrivedAt = now; this.setState({ ch: t.target, tch: t.target }); }
      if (k >= 1) {
        this.tw = null; this.restAt = now; this.lockUntil = now + 120;
        if (this.queue) { const q = this.queue; this.queue = 0; this.lockUntil = 0; const n = this.nb(this.state.cur, q); if (n >= 0) this.go(n); }
      }
    } else {
      const c = this.state.cur, r = this.rest(c), m = this.driftMax(c);
      const k = Math.min(1, (now - this.restAt) / 16000);
      this.baseY = r + (m - r) * (1 - Math.pow(1 - k, 2));
      this.y = this.baseY + this.dragOff;
    }
    if (this.root) {
      const g = Math.min(1, Math.abs(this.dragOff) / 0.5), key = (Math.sign(this.dragOff) * g).toFixed(3);
      if (key !== this.dgLast) { this.dgLast = key; this.root.style.setProperty('--dg', g.toFixed(3)); this.root.style.setProperty('--dgs', key); }
    }
    this.eng.setScroll(this.y);
    if (this.prog) this.prog.style.width = ((this.y / this.SHOTS[this.SHOTS.length - 1].s0) * 100).toFixed(2) + '%';
    const ch = this.state.ch;
    if (ch === 5) { const st = Math.max(0, Math.min(3, Math.floor((now - this.arrivedAt - 900) / 1700))); if (st !== this.state.step) this.setState({ step: st }); }
    if (this.spin) {
      const wide = !this.portrait(window.innerWidth, window.innerHeight);
      const rz = wide ? 'min(26vw, 44vh)' : 'min(52vw, 34vh)';
      this.spin.style.setProperty('--rz', rz);
      const a = (now / 1000) * 9 + (ch === 7 ? 0 : 40);
      this.spin.style.transform = 'translateZ(-' + rz + ') rotateX(-6deg) rotateY(' + (-a).toFixed(2) + 'deg)';
    }
  }
  renderVals() {
    const s = this.state, N = this.NAMES, last = this.SHOTS.length - 1;
    const c = {};
    for (let i = 0; i < this.SHOTS.length; i++) c['k' + i] = s.ch === i ? 'on' : '';
    const ch = s.cur;
    const stepsDef = [
      ['Разговор', 'Повод, человек, место, настроение. Флорист слушает и задаёт вопросы.'],
      ['Замысел', 'Палитра, форма и серия. Иногда — эскиз, всегда — название.'],
      ['Материал', 'Сезонные цветы, ветки, керамика, стекло, лён — под замысел, а не под прайс.'],
      ['Сборка и коробка', 'Работу собирают как скульптуру и везут в коробке мастерской.']
    ];
    const cursorLabels = ['дальше', 'смотреть', 'ближе', 'смотреть', 'смотреть', 'процесс', 'повод', 'зал 2', 'смотреть', 'замысел', 'деталь', 'заявка'];
    return {
      toneCls: s.tch >= 7 ? 'dk' : '',
      navCls: s.cur === 0 && s.ch !== -1 ? 'nav0' : '',
      c: c,
      ringOn: s.ch === 7 ? 'on' : '',
      // Миниатюры кольца галереи (глава 8): src появляется, когда первый экран готов, —
      // до этого они не конкурируют с ним за сеть.
      th: s.ready ? { 'bouquet-dark-window': 'img/t/bouquet-dark-window.webp', anemones: 'img/t/anemones.webp', dahlias: 'img/t/dahlias.webp', 'petal-detail': 'img/t/petal-detail.webp', 'peony-dark': 'img/t/peony-dark.webp', tenderness: 'img/t/tenderness.webp', 'three-roses': 'img/t/three-roses.webp', lightness: 'img/t/lightness.webp' } : {},
      steps: stepsDef.map((d, i) => ({ n: '0' + (i + 1), t: d[0], d: d[1], cls: i === s.step ? 'on' : '' })),
      setRoot: (el) => { this.root = el; if (el) this.applyBand(); },
      setCanvas: (el) => { this.canvas = el; },
      setSpin: (el) => { this.spin = el; },
      setProg: (el) => { this.prog = el; },
      setCursor: (el) => { this.cursor = el; },
      rail: N.map((n, i) => ({ name: n, cls: i === ch ? 'on' : '', go: () => this.go(i) })),
      chLabel: (ch < 9 ? '0' : '') + (ch + 1) + ' — ' + N[ch],
      counter: (() => { const q = this.seq(), k = Math.max(0, q.indexOf(ch)) + 1; return (k < 10 ? '0' : '') + k + ' / ' + q.length; })(),
      ticks: this.seq().map((i) => ({ cls: i === ch ? 'on' : '' })),
      nextName: ch < last ? 'дальше: ' + N[ch + 1] : 'конец экспозиции',
      cursorLabel: cursorLabels[ch],
      toTop: () => this.go(0),
      toWorks: () => this.go(2),
      toSeries: () => this.go(7),
      toProcess: () => this.go(5),
      toForm: () => this.go(last)
    };
  }
}
</script>
